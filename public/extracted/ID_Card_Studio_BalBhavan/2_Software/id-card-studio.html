<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>ID Card Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Open+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&family=Poppins:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: print-shop workbench. Student list | live card proof | controls. Crop-mark corners mark the proof. */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface-2:#f6f7f8; --line:#d9dde2; --fg:#16191d; --muted:#5d6670;
  --accent:#c4165a; --accent-ink:#ffffff; --accent-soft:#fbe7ef; --cyan:#0b7fa6;
  --warn:#a35a00; --warn-soft:#fff3e0; --bad:#b3261e; --bad-soft:#fdecea; --ok:#1d7a46; --ok-soft:#e6f4ec;
  --stage:#dfe3e7;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121417; --surface:#1b1e22; --surface-2:#22262b; --line:#33383f; --fg:#e9ecef; --muted:#9aa3ad;
  --accent:#ff5c95; --accent-ink:#1a0710; --accent-soft:#3a1424; --cyan:#4cc3e6;
  --warn:#f0a83a; --warn-soft:#3a2a10; --bad:#ff7b72; --bad-soft:#3d1714; --ok:#5fd18f; --ok-soft:#12301f;
  --stage:#0c0e10; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121417; --surface:#1b1e22; --surface-2:#22262b; --line:#33383f; --fg:#e9ecef; --muted:#9aa3ad;
  --accent:#ff5c95; --accent-ink:#1a0710; --accent-soft:#3a1424; --cyan:#4cc3e6;
  --warn:#f0a83a; --warn-soft:#3a2a10; --bad:#ff7b72; --bad-soft:#3d1714; --ok:#5fd18f; --ok-soft:#12301f;
  --stage:#0c0e10; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;display:flex;flex-direction:column}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;letter-spacing:.01em;margin-right:auto}
.brand svg{flex:none}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.app{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr) 340px}
@media (max-width:1100px){.app{grid-template-columns:220px minmax(0,1fr) 300px}}
@media (max-width:860px){.app{grid-template-columns:1fr;overflow:auto}.app>*{min-height:auto}.list{max-height:260px}}
.list,.panel{background:var(--surface);display:flex;flex-direction:column;min-height:0}
.list{border-right:1px solid var(--line)}
.panel{border-left:1px solid var(--line)}
.list-head{padding:12px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.list-head .row{display:flex;gap:6px;align-items:center;justify-content:space-between}
.count{font-size:12px;color:var(--muted)}
.input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:6px 8px;font-size:13px}
.input:focus{border-color:var(--cyan);outline:none}
.students{overflow:auto;flex:1;padding:4px 0}
.stu{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;padding:8px 12px;border-left:3px solid transparent;cursor:pointer}
.stu:hover{background:var(--surface-2)}
.stu.active{background:var(--accent-soft);border-left-color:var(--accent)}
.stu.off .stu-name{text-decoration:line-through;color:var(--muted)}
.stu-seq{font-family:var(--f-mono);font-size:11px;color:var(--muted);grid-row:span 2}
.stu-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu-meta{font-size:11.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:99px;letter-spacing:.02em}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage)}
.stage-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.stage-bar .spacer{flex:1}
.nav{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.stage-body{flex:1;overflow:auto;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:18px}
.banner{max-width:900px;width:100%;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:500}
.faces{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;width:100%}
.face{display:flex;flex-direction:column;gap:8px;align-items:center}
.face-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.proof{position:relative;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.10)}
.proof canvas{display:block}
.proof::before,.proof::after{content:"";position:absolute;width:14px;height:14px;border:1.5px solid var(--muted);pointer-events:none}
.proof::before{left:-9px;top:-9px;border-right:0;border-bottom:0}
.proof::after{right:-9px;bottom:-9px;border-left:0;border-top:0}
.ov{position:absolute;inset:0}
.box{position:absolute;border:1px dashed rgba(11,127,166,.75);cursor:move;touch-action:none}
.box:hover{background:rgba(11,127,166,.08)}
.box.sel{border:1.5px solid var(--accent);background:rgba(196,22,90,.07)}
.box .tag{position:absolute;left:-1px;top:-17px;font-size:10px;font-weight:600;background:var(--accent);color:var(--accent-ink);padding:1px 5px;border-radius:3px 3px 0 0;white-space:nowrap;display:none}
.box.sel .tag{display:block}
.box .h{position:absolute;right:-5px;bottom:-5px;width:10px;height:10px;background:var(--accent);border:2px solid var(--surface);border-radius:2px;cursor:nwse-resize;display:none}
.box.sel .h{display:block}
.issues{max-width:900px;width:100%;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sheet-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.sheet-wrap canvas{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.12),0 8px 24px rgba(0,0,0,.10);max-width:100%;height:auto}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;padding:11px 6px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.panel-body{overflow:auto;flex:1;padding:14px;display:flex;flex-direction:column;gap:16px}
.group{display:grid;gap:8px}
.group>h3{margin:0;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:grid;gap:4px}
.field>label,.lbl{font-size:12px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 .input{font-family:var(--f-mono);font-size:12px;padding:5px 6px}
.el-list{display:grid;gap:2px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:3px}
.el-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:4px;cursor:pointer;font-size:12.5px;border:0;background:transparent;text-align:left;width:100%}
.el-item:hover{background:var(--surface-2)}
.el-item.sel{background:var(--accent-soft)}
.el-item .k{font-family:var(--f-mono);font-size:10px;color:var(--muted);min-width:34px}
.el-item .side{margin-left:auto;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row-btns{display:flex;gap:6px;flex-wrap:wrap}
.photos-edit{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.ph{border:1px solid var(--line);border-radius:6px;padding:6px;display:grid;gap:5px;justify-items:center;background:var(--surface-2)}
.ph .thumb{width:72px;height:86px;object-fit:cover;border-radius:3px;background:var(--line)}
.ph .empty{width:72px;height:86px;border-radius:3px;border:1px dashed var(--muted);display:grid;place-items:center;font-size:10px;color:var(--muted);text-align:center}
.ph .cap{font-size:11px;font-weight:600;text-align:center}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
.hint{font-size:12px;color:var(--muted);line-height:1.45}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;max-width:calc(100% - 32px)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:10px;padding:18px;max-width:420px;width:100%;display:grid;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{margin:0;font-size:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="3" y="7" width="24" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="6" y="10" width="6" height="8" fill="var(--accent)"/><path d="M15 12h9M15 15.5h7M15 19h8" stroke="currentColor" stroke-width="1.6"/></svg>
    <div>ID Card Studio<small id="tplTitle">Bal Bhavan International School</small></div>
  </div>
  <label class="btn file-btn" title="Excel (.xlsx) with photos placed in cells">
    <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2 11v3h12v-3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    Import students (.xlsx)
    <input type="file" id="xlsxInput" accept=".xlsx,.xlsm">
  </label>
  <button class="btn primary" id="exportTop">Export cards</button>
</header>

<main class="app">
  <aside class="list" aria-label="Students">
    <div class="list-head">
      <div class="row"><strong>Students</strong><span class="count" id="countLbl"></span></div>
      <input class="input" id="search" placeholder="Search name, class, number" aria-label="Search students">
      <div class="row">
        <select class="input" id="sortSel" aria-label="Order" style="flex:1">
          <option value="excel">Order: as in Excel</option>
          <option value="serial">Order: Serial / Adm. No.</option>
          <option value="class">Order: Class, then name</option>
          <option value="name">Order: Name A–Z</option>
        </select>
      </div>
      <div class="row" id="dupRow" hidden>
        <span class="chip warn" id="dupLbl"></span>
        <button class="btn small" id="dupFix">Keep latest only</button>
      </div>
    </div>
    <div class="students" id="stuList"></div>
  </aside>

  <section class="stage" aria-label="Preview">
    <div class="stage-bar">
      <div class="seg" role="group" aria-label="Preview type">
        <button id="vCard" aria-pressed="true">Card</button>
        <button id="vSheet" aria-pressed="false">A4 sheet</button>
      </div>
      <span class="nav"><button class="btn small ghost" id="prevBtn" aria-label="Previous">◀</button><span id="navLbl">1 / 1</span><button class="btn small ghost" id="nextBtn" aria-label="Next">▶</button></span>
      <span class="spacer"></span>
      <label class="check" id="guidesWrap"><input type="checkbox" id="guidesChk" checked> Show field boxes</label>
    </div>
    <div class="stage-body" id="stageBody">
      <div class="banner" id="exampleBanner">Example student shown. Import your Excel file to see real cards.</div>
      <div class="faces" id="faces">
        <div class="face"><span class="face-label">Front</span><div class="proof" id="proofFront"><canvas id="cFront"></canvas><div class="ov" id="ovFront"></div></div></div>
        <div class="face"><span class="face-label">Back</span><div class="proof" id="proofBack"><canvas id="cBack"></canvas><div class="ov" id="ovBack"></div></div></div>
      </div>
      <div class="issues" id="issuesBar"></div>
      <div class="sheet-wrap" id="sheetWrap" hidden><canvas id="cSheet"></canvas><span class="hint" id="sheetHint"></span></div>
    </div>
  </section>

  <aside class="panel" aria-label="Controls">
    <div class="tabs" role="tablist">
      <button role="tab" id="tStudent" aria-selected="true">Student</button>
      <button role="tab" id="tDesign" aria-selected="false">Design</button>
      <button role="tab" id="tExport" aria-selected="false">Export</button>
    </div>
    <div class="panel-body" id="pStudent"></div>
    <div class="panel-body" id="pDesign" hidden></div>
    <div class="panel-body" id="pExport" hidden></div>
  </aside>
</main>
<div class="toast" id="toast" hidden></div>
<div class="modal-back" id="modal" hidden><div class="modal" id="modalBox"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

const fontReady=new Set();

/* ---------- Text logic ---------- */
function valueOf(stu,key){
  const n=norm(key); if(!stu)return"";
  if(stu.values[key]!=null)return String(stu.values[key]).trim();
  for(const k in stu.values)if(norm(k)===n)return String(stu.values[k]).trim();
  return "";
}
const ROMAN=["","I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
function applyFmt(t,fmt){
  if(fmt==="upper")return t.toUpperCase();
  if(fmt==="date")return t.replace(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/,(m,d,mo,y)=>`${d.padStart(2,"0")}-${mo.padStart(2,"0")}-${y}`);
  if(fmt==="roman")return t.toUpperCase().replace(/(^|[\s:])(\d{1,2})(?=$|[\s\-\/])/,(m,p,n)=>p+(ROMAN[+n]||n));
  return t;
}
function resolveText(e,stu){
  const parts=e.content.split(/(\{[^}]+\})/);let out="",missing=[];
  for(const p of parts){
    if(/^\{[^}]+\}$/.test(p)){const key=p.slice(1,-1);const v=valueOf(stu,key);if(v)out+=v;else{out+="\u0000";missing.push(key)}}
    else out+=p;
  }
  out=out.replace(/[\s,\-\/]*\u0000/g,"").replace(/\u0000/g,"").replace(/\s+$/,"");
  return{text:applyFmt(out,e.fmt),missing};
}
function wrapLines(ctx,text,maxW,maxLines){
  if(maxLines<=1)return ctx.measureText(text).width<=maxW?[text]:null;
  const words=text.split(/\s+/).filter(Boolean);const lines=[];let line="";
  for(const w of words){
    const test=line?line+" "+w:w;
    if(ctx.measureText(test).width<=maxW){line=test;continue}
    if(!line)return null;
    lines.push(line);line=w;
    if(ctx.measureText(w).width>maxW)return null;
  }
  if(line)lines.push(line);
  return lines.length<=maxLines?lines:null;
}
function fontStr(e,sizePx){return`${e.weight} ${sizePx}px "${e.font}", Arial, sans-serif`}
function layoutText(ctx,e,text,k){
  let size=e.size;const min=e.size*0.55;let lines=null;
  while(size>=min){ctx.font=fontStr(e,size*k);lines=wrapLines(ctx,text,e.w*k,e.lines||1);if(lines)break;size*=0.96}
  let overflow=false;
  if(!lines){size=min;ctx.font=fontStr(e,size*k);lines=(e.lines||1)>1?forceWrap(ctx,text,e.w*k,e.lines):[text];overflow=true}
  return{lines,size,shrunk:size<e.size*0.86,overflow};
}
function forceWrap(ctx,text,maxW,maxLines){
  const words=text.split(/\s+/);const lines=[];let line="";
  for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width<=maxW||!line)line=t;else{lines.push(line);line=w}}
  if(line)lines.push(line);
  if(lines.length>maxLines){const head=lines.slice(0,maxLines-1);head.push(lines.slice(maxLines-1).join(" "));return head}
  return lines;
}

/* ---------- Rendering ---------- */
function photoFor(stu,col){
  if(!stu)return null;
  if(stu.photos[col])return stu.photos[col];
  const n=norm(col);for(const k in stu.photos)if(norm(k)===n)return stu.photos[k];
  return null;
}
function drawImageFit(ctx,img,x,y,w,h,fit){
  if(fit==="contain"){
    const s=Math.min(w/img.width,h/img.height);const dw=img.width*s,dh=img.height*s;
    ctx.fillStyle="#fff";ctx.fillRect(x,y,w,h);ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);return;
  }
  const s=Math.max(w/img.width,h/img.height);const sw=w/s,sh=h/s;
  const sx=(img.width-sw)/2;const sy=Math.max(0,Math.min(img.height-sh,(img.height-sh)*0.3));
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);
}
function drawBorder(ctx,e,x,y,w,h,k){
  if(!e.border)return;ctx.lineWidth=e.border*k;ctx.strokeStyle=e.borderColor||"#000";
  const o=ctx.lineWidth/2;ctx.strokeRect(x+o,y+o,w-2*o,h-2*o);
}
function placeholder(ctx,x,y,w,h,label,k){
  ctx.save();ctx.fillStyle="rgba(120,130,140,.18)";ctx.fillRect(x,y,w,h);
  ctx.setLineDash([1.2*k,0.8*k]);ctx.strokeStyle="rgba(90,100,110,.7)";ctx.lineWidth=Math.max(1,0.15*k);ctx.strokeRect(x,y,w,h);
  ctx.setLineDash([]);ctx.fillStyle="rgba(60,70,80,.85)";ctx.font=`600 ${1.5*k}px "Instrument Sans", Arial`;ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillText(label,x+w/2,y+h/2,w-0.6*k);ctx.restore();
}
async function prepare(stu,tpl){
  await ensureFonts(tpl);
  const srcs=[tpl.bg.front,tpl.bg.back];
  if(stu)for(const p of Object.values(stu.photos))srcs.push(p);
  await Promise.all(srcs.map(loadImg));
}
async function drawFace(ctx,side,stu,tpl,k,opts={}){
  const W=tpl.w*k,H=tpl.h*k;
  ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);
  const bg=await loadImg(tpl.bg[side]);if(bg)ctx.drawImage(bg,0,0,W,H);
  for(const e of tpl.elements){
    if(e.side!==side)continue;
    const x=e.x*k,y=e.y*k,w=e.w*k,h=e.h*k;
    if(e.type==="text"){
      const{text}=resolveText(e,stu);if(!text)continue;
      const L=layoutText(ctx,e,text,k);
      ctx.font=fontStr(e,L.size*k);ctx.fillStyle=e.color;ctx.textBaseline="alphabetic";
      ctx.textAlign=e.align==="center"?"center":e.align==="right"?"right":"left";
      const cap=ctx.measureText("H").actualBoundingBoxAscent||L.size*k*0.72;
      const lh=L.size*k*1.24;const total=lh*(L.lines.length-1)+cap;
      let by=y+(h-total)/2+cap;
      const ax=e.align==="center"?x+w/2:e.align==="right"?x+w:x;
      for(const ln of L.lines){ctx.fillText(ln,ax,by);by+=lh}
    }else if(e.type==="photo"){
      const src=photoFor(stu,e.column);const img=await loadImg(src);
      if(img){drawImageFit(ctx,img,x,y,w,h,e.fit);drawBorder(ctx,e,x,y,w,h,k)}
      else if(opts.guides)placeholder(ctx,x,y,w,h,"No photo",k);
    }else if(e.type==="photos"){
      const imgs=[];for(const c of e.columns){const im=await loadImg(photoFor(stu,c));if(im)imgs.push(im)}
      const n=Math.max(1,e.slots|0);const gap=e.gap*k;const sw=(w-gap*(n-1))/n;
      const used=Math.min(imgs.length,n);
      let x0=x;if(e.layout==="center")x0=x+(w-(used*sw+(used-1)*gap))/2;
      for(let i=0;i<used;i++){const sx=x0+i*(sw+gap);drawImageFit(ctx,imgs[i],sx,y,sw,h,e.fit);drawBorder(ctx,e,sx,y,sw,h,k)}
      if(opts.guides&&used===0)placeholder(ctx,x,y,w,h,"No pick-up photos",k);
    }
  }
}

const mctx=document.createElement("canvas").getContext("2d");
function analyze(stu,tpl){
  const out=[];
  for(const e of tpl.elements){
    if(e.type==="text"){
      const{text,missing}=resolveText(e,stu);
      if(missing.length&&!text.replace(/[:\s]/g,""))out.push({lvl:"warn",msg:`${e.label}: empty`});
      if(text){const L=layoutText(mctx,e,text,6);if(L.overflow)out.push({lvl:"bad",msg:`${e.label}: too long`});else if(L.shrunk)out.push({lvl:"warn",msg:`${e.label}: text shrunk`})}
    }else if(e.type==="photo"){if(!photoFor(stu,e.column))out.push({lvl:"bad",msg:`${e.label}: missing`})}
    else if(e.type==="photos"){const c=e.columns.filter(c=>photoFor(stu,c)).length;if(!c)out.push({lvl:"bad",msg:`${e.label}: none`})}
  }
  if(stu.dup)out.push({lvl:"warn",msg:"Duplicate entry"});
  return out;
}

/* ---------- Excel import (values + photos anchored to cells) ---------- */
function relsMap(xml){const m={};if(!xml)return m;const d=new DOMParser().parseFromString(xml,"application/xml");
  for(const r of d.getElementsByTagNameNS("*","Relationship"))m[r.getAttribute("Id")]={target:r.getAttribute("Target"),type:r.getAttribute("Type")||""};return m}
function resolvePath(baseDir,target){if(target.startsWith("/"))return target.slice(1);const parts=(baseDir+"/"+target).split("/");const out=[];for(const p of parts){if(p===".."){out.pop()}else if(p&&p!=="."){out.push(p)}}return out.join("/")}
const dirOf=p=>p.split("/").slice(0,-1).join("/");
const baseOf=p=>p.split("/").pop();
function attrLocal(node,local){for(const a of node.attributes)if(a.localName===local)return a.value;return null}
const MIME={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",bmp:"image/bmp",webp:"image/webp"};

async function parseWorkbook(buf){
  const zip=await JSZip.loadAsync(buf);
  const wb=XLSX.read(buf,{type:"array"});
  const read=async p=>{const f=zip.file(p);return f?f.async("string"):null};
  const wbDoc=new DOMParser().parseFromString(await read("xl/workbook.xml"),"application/xml");
  const wbRels=relsMap(await read("xl/_rels/workbook.xml.rels"));
  const sheets=[];
  for(const sh of wbDoc.getElementsByTagNameNS("*","sheet")){
    const name=sh.getAttribute("name");const rid=attrLocal(sh,"id");
    const path=wbRels[rid]?resolvePath("xl",wbRels[rid].target):null;
    const ws=wb.Sheets[name];if(!ws||!ws["!ref"])continue;
    const range=XLSX.utils.decode_range(ws["!ref"]);
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:"",blankrows:true});
    const images=[];
    if(path){
      const sRels=relsMap(await read(dirOf(path)+"/_rels/"+baseOf(path)+".rels"));
      for(const r of Object.values(sRels)){
        if(!/\/drawing$/.test(r.type))continue;
        const dPath=resolvePath(dirOf(path),r.target);const dXml=await read(dPath);if(!dXml)continue;
        const dRels=relsMap(await read(dirOf(dPath)+"/_rels/"+baseOf(dPath)+".rels"));
        const dDoc=new DOMParser().parseFromString(dXml,"application/xml");
        const anchors=[...dDoc.documentElement.children].filter(n=>/Anchor$/.test(n.localName));
        for(const a of anchors){
          const from=a.getElementsByTagNameNS("*","from")[0];if(!from)continue;
          const col=+from.getElementsByTagNameNS("*","col")[0].textContent;const row=+from.getElementsByTagNameNS("*","row")[0].textContent;
          const blip=a.getElementsByTagNameNS("*","blip")[0];if(!blip)continue;
          const rel=dRels[attrLocal(blip,"embed")];if(!rel)continue;
          const mPath=resolvePath(dirOf(dPath),rel.target);const f=zip.file(mPath);if(!f)continue;
          const ext=mPath.split(".").pop().toLowerCase();
          const blob=new Blob([await f.async("arraybuffer")],{type:MIME[ext]||"image/png"});
          images.push({row,col,blob});
        }
      }
    }
    sheets.push({name,rows,images,r0:range.s.r,c0:range.s.c});
  }
  return sheets;
}
function sheetToStudents(sh){
  const rows=sh.rows;let hi=rows.findIndex(r=>r.filter(v=>String(v).trim()).length>=2);if(hi<0)return null;
  const headers=rows[hi].map((h,i)=>String(h).trim()||`Column ${i+1}`);
  const imgAt=new Map();for(const im of sh.images){const r=im.row-sh.r0,c=im.col-sh.c0;imgAt.set(r+":"+c,im.blob)}
  const photoCols=new Set();for(const im of sh.images){const h=headers[im.col-sh.c0];if(h)photoCols.add(h)}
  headers.forEach(h=>{if(/photo|image|pic/i.test(h))photoCols.add(h)});
  const students=[];
  for(let r=hi+1;r<rows.length;r++){
    const row=rows[r]||[];const hasVal=row.some(v=>String(v).trim());
    const hasImg=headers.some((h,c)=>imgAt.has(r+":"+c));
    if(!hasVal&&!hasImg)continue;
    const values={},photos={};
    headers.forEach((h,c)=>{const b=imgAt.get(r+":"+c);if(b){photos[h]=URL.createObjectURL(b)}if(!photoCols.has(h))values[h]=String(row[c]??"").trim()});
    students.push({uid:"s"+r+"_"+Math.random().toString(36).slice(2,7),excelRow:r+1,values,photos,include:true});
  }
  return{headers,photoCols:[...photoCols],students};
}
function markDuplicates(){
  const keyCol=S.headers.find(h=>/serial|adm/i.test(h)&&!/^sr\.?\s*no/i.test(h));
  const seen=new Map();
  for(const s of S.students){s.dup=false;}
  for(const s of S.students){
    const key=keyCol?valueOf(s,keyCol):"";const k=key||(valueOf(s,"Student Name")+"|"+valueOf(s,"Date of Birth"));
    if(!k.replace("|",""))continue;
    if(seen.has(k)){s.dup=true;seen.get(k).dup=true}else seen.set(k,s);
  }
}

/* ---------- Ordering ---------- */
function classKey(v){const t=String(v).toUpperCase();const m=t.match(/^(\d{1,2})/);if(m)return(+m[1]+10)+t.slice(m[1].length);
  const r=t.match(/^(XII|XI|X|IX|VIII|VII|VI|V|IV|III|II|I)\b/);if(r)return(ROMAN.indexOf(r[1])+10)+t.slice(r[1].length);return"0"+t}
function ordered(){
  const a=[...S.students];const sk=S.headers.find(h=>/serial|adm/i.test(h)&&!/^sr\.?\s*no/i.test(h))||"Serial No";
  if(S.sort==="serial")a.sort((x,y)=>valueOf(x,sk).localeCompare(valueOf(y,sk),undefined,{numeric:true}));
  else if(S.sort==="name")a.sort((x,y)=>valueOf(x,"Student Name").localeCompare(valueOf(y,"Student Name")));
  else if(S.sort==="class")a.sort((x,y)=>classKey(valueOf(x,"Class & Section")).localeCompare(classKey(valueOf(y,"Class & Section")),undefined,{numeric:true})||valueOf(x,"Student Name").localeCompare(valueOf(y,"Student Name")));
  return a;
}

  const q=S.search.toLowerCase();let seq=0;
  for(const s of ordered()){
    if(s.include)seq++;
    const hay=Object.values(s.values).join(" ").toLowerCase();if(q&&!hay.includes(q))continue;
    const iss=analyze(s,S.tpl);const bad=iss.filter(i=>i.lvl==="bad").length,warn=iss.filter(i=>i.lvl==="warn").length;
    const cb=el("input",{type:"checkbox","aria-label":"Include in export"});cb.checked=s.include;
    cb.addEventListener("click",ev=>{ev.stopPropagation();s.include=cb.checked;renderList();updateCount();if(S.view==="sheet")renderStage()});
    const row=el("div",{class:"stu"+(s.uid===S.cur?" active":"")+(s.include?"":" off"),tabindex:"0"},
      el("span",{class:"stu-seq"},s.include?String(seq).padStart(3,"0"):"—"),
      el("div",{class:"stu-name"},valueOf(s,"Student Name")||"(no name)"),
      el("div",{class:"stu-meta"},cb,valueOf(s,"Class & Section"),valueOf(s,"Serial No")?" · "+valueOf(s,"Serial No"):"",
        bad?el("span",{class:"chip bad"},bad+" error"+(bad>1?"s":"")):null, warn?el("span",{class:"chip warn"},warn+" check"):null,
        !bad&&!warn?el("span",{class:"chip ok"},"Ready"):null));
    const pick=()=>{S.cur=s.uid;renderList();renderStage();if(S.tab==="student")renderStudentPanel()};
    row.addEventListener("click",pick);row.addEventListener("keydown",e=>{if(e.key==="Enter")pick()});
    list.append(row);

}
function updateCount(){
  const inc=S.students.filter(s=>s.include).length;

  const d=S.students.filter(s=>s.dup).length;$("dupRow").hidden=!d;$("dupLbl").textContent=`${d} duplicate rows`;

/* ---------- Stage ---------- */
function cardScale(){
  const body=$("stageBody");const avail=Math.max(260,body.clientWidth-48);
  const two=avail>=2*300+22;const w=two?Math.min(560,(avail-22)/2):Math.min(560,avail);
  return w/S.tpl.w;
}
let renderToken=0;
async function renderStage(){
  const tok=++renderToken;const stu=currentStu();
  $("exampleBanner").hidden=!S.example;
  const card=S.view==="card";
  $("faces").hidden=!card;$("issuesBar").hidden=!card;$("sheetWrap").hidden=card;$("guidesWrap").hidden=!card;
  await prepare(stu,S.tpl);if(tok!==renderToken)return;
  if(card){
    const k=cardScale();const dpr=window.devicePixelRatio||1;
    for(const side of["front","back"]){
      const c=$(side==="front"?"cFront":"cBack");c.width=Math.round(S.tpl.w*k*dpr);c.height=Math.round(S.tpl.h*k*dpr);
      c.style.width=S.tpl.w*k+"px";c.style.height=S.tpl.h*k+"px";
      const ctx=c.getContext("2d");ctx.setTransform(1,0,0,1,0,0);
      await drawFace(ctx,side,stu,S.tpl,k*dpr,{guides:true});if(tok!==renderToken)return;
    }
    renderOverlay(k);
    const bar=$("issuesBar");bar.textContent="";
    if(stu)for(const i of analyze(stu,S.tpl))bar.append(el("span",{class:"chip "+i.lvl},i.msg));
    const list=ordered();const idx=list.findIndex(s=>s.uid===(stu&&stu.uid));
    $("navLbl").textContent=`${idx+1} / ${list.length}`;
  }else{
    await renderSheet(tok);
  }
}
async function renderSheet(tok){
  const inc=included();const per=S.exp.rows;const pages=Math.max(1,Math.ceil(inc.length/per));
  const stu=currentStu();const idx=inc.findIndex(s=>s===stu);
  if(idx>=0)S.sheetPage=Math.floor(idx/per);S.sheetPage=Math.min(S.sheetPage,pages-1);
  const body=$("stageBody");const dispW=Math.min(640,body.clientWidth-32);const k=dispW/210;const dpr=window.devicePixelRatio||1;
  const c=$("cSheet");c.width=Math.round(210*k*dpr);c.height=Math.round(297*k*dpr);c.style.width=dispW+"px";c.style.height=297*k+"px";
  const ctx=c.getContext("2d");ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);
  const L=sheetLayout();const kk=k*dpr;
  const slice=inc.slice(S.sheetPage*per,S.sheetPage*per+per);
  const fc=document.createElement("canvas");fc.width=Math.round(S.tpl.w*kk);fc.height=Math.round(S.tpl.h*kk);const fx=fc.getContext("2d");
  for(let i=0;i<slice.length;i++){
    await prepare(slice[i],S.tpl);if(tok!==renderToken)return;
    for(const side of["front","back"]){
      await drawFace(fx,side,slice[i],S.tpl,kk);const p=L.pos(i,side);ctx.drawImage(fc,p.x*kk,p.y*kk,S.tpl.w*kk,S.tpl.h*kk);
    }
  }
  ctx.strokeStyle="rgba(0,0,0,.08)";ctx.strokeRect(0.5,0.5,c.width-1,c.height-1);
  $("navLbl").textContent=`Sheet ${S.sheetPage+1} / ${pages}`;
  $("sheetHint").textContent=`${inc.length} cards · ${pages} A4 sheet${pages>1?"s":""} · ${per} students per sheet, front and back side by side`;
}
function sheetLayout(){
  const W=S.tpl.w,H=S.tpl.h,rows=S.exp.rows,rg=+S.exp.rowGap,cg=+S.exp.colGap;
  const blockW=2*W+cg,blockH=rows*H+(rows-1)*rg;
  const left=(210-blockW)/2,top=(297-blockH)/2;
  return{left,top,fits:left>=0&&top>=0,pos:(i,side)=>({x:left+(side==="back"?W+cg:0),y:top+i*(H+rg)})};
}

/* ---------- Design overlay ---------- */
function renderOverlay(k){
  for(const side of["front","back"]){
    const ov=$(side==="front"?"ovFront":"ovBack");ov.textContent="";
    if(S.tab!=="design"||!$("guidesChk").checked)continue;
    for(const e of S.tpl.elements){
      if(e.side!==side)continue;
      const b=el("div",{class:"box"+(S.sel===e.id?" sel":""),title:e.label},el("span",{class:"tag"},e.label),el("span",{class:"h"}));
      Object.assign(b.style,{left:e.x*k+"px",top:e.y*k+"px",width:e.w*k+"px",height:e.h*k+"px"});
      b.addEventListener("pointerdown",ev=>startDrag(ev,e,k,ev.target.classList.contains("h")));
      ov.append(b);
    }
  }
}
let drag=null,rafPending=false;
function startDrag(ev,e,k,resize){
  ev.preventDefault();ev.stopPropagation();
  if(S.sel!==e.id){S.sel=e.id;renderDesignPanel();}
  drag={e,k,resize,sx:ev.clientX,sy:ev.clientY,ox:e.x,oy:e.y,ow:e.w,oh:e.h};
  ev.target.setPointerCapture?.(ev.pointerId);
  renderOverlay(k);
}
window.addEventListener("pointermove",ev=>{
  if(!drag)return;const{e,k}=drag;const dx=(ev.clientX-drag.sx)/k,dy=(ev.clientY-drag.sy)/k;
  if(drag.resize){e.w=round(Math.max(2,drag.ow+dx),1);e.h=round(Math.max(1.5,drag.oh+dy),1)}
  else{e.x=round(Math.min(S.tpl.w-1,Math.max(-e.w+1,drag.ox+dx)),1);e.y=round(Math.min(S.tpl.h-1,Math.max(-e.h+1,drag.oy+dy)),1)}
  if(!rafPending){rafPending=true;requestAnimationFrame(()=>{rafPending=false;renderStage();syncGeom()})}
});
window.addEventListener("pointerup",()=>{if(drag){drag=null;templateChanged()}});
window.addEventListener("keydown",ev=>{
  if(S.tab!=="design"||!S.sel)return;const t=ev.target;if(t.matches&&t.matches("input,textarea,select"))return;
  const e=S.tpl.elements.find(x=>x.id===S.sel);if(!e)return;const st=ev.shiftKey?1:0.1;
  const m={ArrowLeft:["x",-st],ArrowRight:["x",st],ArrowUp:["y",-st],ArrowDown:["y",st]}[ev.key];
  if(m){ev.preventDefault();e[m[0]]=round(e[m[0]]+m[1],2);renderStage();syncGeom();templateChangedSoon()}
  if(ev.key==="Delete"||ev.key==="Backspace"){ev.preventDefault();deleteEl(e.id)}
});
function syncGeom(){const e=S.tpl.elements.find(x=>x.id===S.sel);if(!e)return;for(const k of["x","y","w","h"]){const i=$("g_"+k);if(i&&document.activeElement!==i)i.value=e[k]}}

}
async function exportTemplate(){await saveFile(`${safeName(S.tpl.name)}_design.json`,new Blob([JSON.stringify(S.tpl)],{type:"application/json"}))}
function importTemplate(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const t=JSON.parse(r.result);if(!t.elements||!t.bg)throw 0;S.tpl=t;S.sel=null;$("tplTitle").textContent=t.name;templateChanged();renderDesignPanel();renderStage();toast(`Opened "${t.name}"`)}catch{toast("That file is not a design file from ID Card Studio.",3500)}};r.readAsText(f)}

/* ---------- Export ---------- */
function renderExportPanel(){
  const p=$("pExport");p.textContent="";const inc=included();const L=sheetLayout();
  const pages=Math.ceil(inc.length/S.exp.rows);
  const bad=inc.filter(s=>analyze(s,S.tpl).some(i=>i.lvl==="bad")).length;
  p.append(el("div",{class:"group"},el("h3",{},"Summary"),
    el("div",{class:"hint",style:"font-size:13px;color:var(--fg)"},el("strong",{class:"mono"},String(inc.length))," students → ",el("strong",{class:"mono"},String(pages))," A4 sheets and ",el("strong",{class:"mono"},String(inc.length))," single-card PDFs"),
    bad?el("span",{class:"chip bad",style:"justify-self:start"},`${bad} selected card${bad>1?"s have":" has"} errors (missing photo or text too long)`):el("span",{class:"chip ok",style:"justify-self:start"},"No errors in selected cards"),
    S.example?el("span",{class:"chip warn",style:"justify-self:start"},"Exporting the example student"):null));
  const re=()=>{renderExportPanel();if(S.view==="sheet")renderStage()};
  p.append(el("div",{class:"group"},el("h3",{},"A4 sheet"),
    el("div",{class:"grid2"},selectInput("Students per sheet",S.exp.rows,[1,2,3,4,5],v=>{S.exp.rows=+v;re()}),fieldInput("Gap between rows (mm)",S.exp.rowGap,v=>{S.exp.rowGap=+v||0;re()},{type:"number",step:"0.5",min:"0"})),
    fieldInput("Gap between front and back (mm)",S.exp.colGap,v=>{S.exp.colGap=+v||0;re()},{type:"number",step:"0.5",min:"0"}),
    L.fits?el("p",{class:"hint",style:"margin:0"},`Margins: ${round(L.left,1)} mm left/right, ${round(L.top,1)} mm top/bottom. Most printers need about 4 mm; check one test sheet before the full run.`)
      :el("span",{class:"chip bad"},"Cards do not fit on A4 with these gaps")));
  p.append(el("div",{class:"group"},el("h3",{},"Single-card PDFs"),
    selectInput("Each PDF contains",S.exp.cardPdf,[["pair","Front and back side by side (1 page)"],["two","Front on page 1, back on page 2"],["front","Front only"]],v=>S.exp.cardPdf=v),
    fieldInput("File name pattern",S.exp.pattern,v=>S.exp.pattern=v),
    el("p",{class:"hint",style:"margin:0"},"{n} is the serial number in the current order (001, 002…). Any Excel column works, like {Class & Section}."),
    el("p",{class:"hint mono",style:"margin:0"},"e.g. "+cardFileName(inc[0]||currentStu(),1))));
  const bar=el("div",{class:"progress"},el("i",{id:"progBar"}));
  p.append(el("div",{class:"group"},el("h3",{},"Download"),
    el("button",{class:"btn primary",id:"zipBtn",onclick:()=>runExport("zip")},"Download ZIP: A4 sheets + all single cards"),
    el("button",{class:"btn",id:"a4Btn",onclick:()=>runExport("a4")},"Download A4 sheets PDF only"),
    bar,el("span",{class:"hint",id:"progLbl"},"")));
}
const safeName=s=>String(s||"").trim().replace(/[^A-Za-z0-9\-_.]+/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"")||"card";
function cardFileName(stu,n){
  if(!stu)return"001.pdf";
  const t=S.exp.pattern.replace(/\{n\}/g,String(n).padStart(3,"0")).replace(/\{([^}]+)\}/g,(m,k)=>valueOf(stu,k));
  return safeName(t)+".pdf";
}
async function saveFile(name,blob){
  try{
    const d=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(d){await d.save({filename:name,data:blob});toast("Saved "+name);return true}
  }catch(err){if(err&&err.code==="declined"){toast("Download cancelled");return false}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);toast("Downloading "+name);return true;
}
let exporting=false;
async function runExport(kind){
  if(exporting)return;const inc=included();if(!inc.length){toast("No students selected.");return}
  const L=sheetLayout();if(!L.fits){toast("Cards do not fit on A4. Reduce the gaps or students per sheet.",3500);return}
  exporting=true;["zipBtn","a4Btn","exportTop"].forEach(i=>$(i)&&($(i).disabled=true));
  const prog=(f,msg)=>{const b=$("progBar");if(b)b.style.width=(f*100)+"%";const l=$("progLbl");if(l)l.textContent=msg};
  try{
    const{jsPDF}=window.jspdf;const T=S.tpl;
    const a4=new jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
    const zip=kind==="zip"?new JSZip():null;const folder=zip?zip.folder("ID_Cards"):null;
    const fc=document.createElement("canvas");fc.width=Math.round(T.w*KX);fc.height=Math.round(T.h*KX);const fx=fc.getContext("2d");
    const per=S.exp.rows;const used=new Set();
    for(let i=0;i<inc.length;i++){
      const s=inc[i];prog(i/inc.length,`Rendering card ${i+1} of ${inc.length}: ${valueOf(s,"Student Name")}`);
      await prepare(s,T);
      await drawFace(fx,"front",s,T,KX);const fImg=fc.toDataURL("image/jpeg",0.93);
      await drawFace(fx,"back",s,T,KX);const bImg=fc.toDataURL("image/jpeg",0.93);
      const slot=i%per;if(i>0&&slot===0)a4.addPage("a4","portrait");
      const pf=L.pos(slot,"front"),pb=L.pos(slot,"back");
      a4.addImage(fImg,"JPEG",pf.x,pf.y,T.w,T.h,undefined,"FAST");a4.addImage(bImg,"JPEG",pb.x,pb.y,T.w,T.h,undefined,"FAST");
      if(folder){
        const mode=S.exp.cardPdf;let doc;
        if(mode==="pair"){doc=new jsPDF({unit:"mm",format:[T.w*2,T.h],orientation:"landscape",compress:true});doc.addImage(fImg,"JPEG",0,0,T.w,T.h,undefined,"FAST");doc.addImage(bImg,"JPEG",T.w,0,T.w,T.h,undefined,"FAST")}
        else{doc=new jsPDF({unit:"mm",format:[T.w,T.h],orientation:T.w>=T.h?"landscape":"portrait",compress:true});doc.addImage(fImg,"JPEG",0,0,T.w,T.h,undefined,"FAST");
          if(mode==="two"){doc.addPage([T.w,T.h],T.w>=T.h?"landscape":"portrait");doc.addImage(bImg,"JPEG",0,0,T.w,T.h,undefined,"FAST")}}
        let name=cardFileName(s,i+1);while(used.has(name))name=name.replace(/\.pdf$/,"_b.pdf");used.add(name);
        folder.file(name,doc.output("arraybuffer"));
      }
      if(i%4===3)await sleep(0);
    }
    const stamp=new Date().toISOString().slice(0,10);const school=safeName(T.name);
    const a4Blob=a4.output("blob");
    if(zip){
      prog(0.97,"Packing ZIP…");
      zip.file(`${school}_A4_Sheets.pdf`,a4Blob);
      const blob=await zip.generateAsync({type:"blob",compression:"STORE"});
      prog(1,`Done: ${inc.length} cards, ${Math.ceil(inc.length/per)} sheets.`);
      await saveFile(`${school}_ID_Cards_${stamp}.zip`,blob);
    }else{
      prog(1,`Done: ${Math.ceil(inc.length/per)} sheets.`);
      await saveFile(`${school}_A4_Sheets_${stamp}.pdf`,a4Blob);
    }
  }catch(err){console.error(err);toast("Export failed: "+(err&&err.message||err),5000);prog(0,"Export failed. Try fewer students at a time.")}
  finally{exporting=false;["zipBtn","a4Btn","exportTop"].forEach(i=>$(i)&&($(i).disabled=false))}
}

/* ---------- Import flow ---------- */
async function importFile(f){
  if(!f)return;toast("Reading "+f.name+"…",8000);
  try{
    const buf=await f.arrayBuffer();const sheets=await parseWorkbook(buf);
    const cands=sheets.map(sh=>({sh,res:sheetToStudents(sh)})).filter(c=>c.res&&c.res.students.length);
    if(!cands.length){toast("No student rows found in that file.",4000);return}
    cands.sort((a,b)=>(b.sh.images.length-a.sh.images.length)||(b.res.students.length-a.res.students.length));
    const top=cands[0],second=cands[1];
    const ambiguous=second&&second.sh.images.length===top.sh.images.length&&second.res.students.length===top.res.students.length;
    const pick=ambiguous?await chooseSheet(cands):top;if(!pick)return;
    const{headers,photoCols,students}=pick.res;
    S.headers=headers;S.photoCols=photoCols;S.students=students;S.example=false;S.cur=students[0].uid;S.sheetPage=0;
    markDuplicates();
    const missingCols=[];for(const e of S.tpl.elements){const keys=e.type==="text"?[...e.content.matchAll(/\{([^}]+)\}/g)].map(m=>m[1]):e.type==="photo"?[e.column]:e.columns;for(const k of keys)if(!headers.some(h=>norm(h)===norm(k)))missingCols.push(k)}
    renderList();setTab(S.tab);
    const imgs=pick.sh.images.length;
    toast(`Loaded ${students.length} students and ${imgs} photos from "${pick.sh.name}".`+(missingCols.length?` Columns not found: ${[...new Set(missingCols)].join(", ")}`:""),missingCols.length?7000:3500);
  }catch(err){console.error(err);toast("Could not read that file. Save it as .xlsx and try again.",4500)}
}
function chooseSheet(cands){
  return new Promise(res=>{
    const box=$("modalBox");box.textContent="";
    box.append(el("h2",{},"Which sheet has the students?"));
    for(const c of cands)box.append(el("button",{class:"btn",onclick:()=>{$("modal").hidden=true;res(c)}},`${c.sh.name}: ${c.res.students.length} rows, ${c.sh.images.length} photos`));
    box.append(el("button",{class:"btn ghost",onclick:()=>{$("modal").hidden=true;res(null)}},"Cancel"));
    $("modal").hidden=false;
  });
}

/* ---------- Wiring ---------- */
$("xlsxInput").addEventListener("change",e=>{importFile(e.target.files[0]);e.target.value=""});
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{e.preventDefault();const f=[...e.dataTransfer.files].find(f=>/\.xlsx?m?$/i.test(f.name));if(f)importFile(f)});
$("search").addEventListener("input",e=>{S.search=e.target.value;renderList()});
$("sortSel").addEventListener("change",e=>{S.sort=e.target.value;renderList();renderStage()});
$("dupFix").addEventListener("click",()=>{
  const keyCol=S.headers.find(h=>/serial|adm/i.test(h)&&!/^sr\.?\s*no/i.test(h));const last=new Map();
  for(const s of S.students){const k=keyCol?valueOf(s,keyCol):valueOf(s,"Student Name");last.set(k,s)}
  let n=0;for(const s of S.students){const k=keyCol?valueOf(s,keyCol):valueOf(s,"Student Name");if(s.dup&&last.get(k)!==s){s.include=false;n++}}
  renderList();renderStage();toast(`Unselected ${n} older duplicate row${n===1?"":"s"}. They stay in the list.`,3500);
});
$("tStudent").onclick=()=>setTab("student");$("tDesign").onclick=()=>setTab("design");$("tExport").onclick=()=>setTab("export");
$("exportTop").onclick=()=>setTab("export");
$("vCard").onclick=()=>{S.view="card";$("vCard").setAttribute("aria-pressed","true");$("vSheet").setAttribute("aria-pressed","false");renderStage()};
$("vSheet").onclick=()=>{S.view="sheet";$("vSheet").setAttribute("aria-pressed","true");$("vCard").setAttribute("aria-pressed","false");renderStage()};
$("guidesChk").onchange=()=>renderStage();
function step(d){
  if(S.view==="sheet"){const inc=included();const per=S.exp.rows;const pages=Math.max(1,Math.ceil(inc.length/per));const np=Math.min(pages-1,Math.max(0,S.sheetPage+d));const s=inc[np*per];if(s)S.cur=s.uid;S.sheetPage=np;renderList();renderStage();return}
  const list=ordered();const i=list.findIndex(s=>s.uid===S.cur);const n=list[Math.min(list.length-1,Math.max(0,i+d))];if(n){S.cur=n.uid;renderList();renderStage();if(S.tab==="student")renderStudentPanel()}
}
$("prevBtn").onclick=()=>step(-1);$("nextBtn").onclick=()=>step(1);
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(renderStage,120)});

(function init(){
  const cur=lsGet("idcs.current",null);
  S.tpl=cur&&cur.elements&&cur.bg?cur:defaultTemplate();$("tplTitle").textContent=S.tpl.name;
  S.students=exampleStudents();S.cur=S.students[0].uid;S.headers=[];S.photoCols=["Student Photo","Father Photo","Mother Photo","Guardian Photo"];
  renderList();setTab("student");
  document.fonts&&document.fonts.ready.then(()=>renderStage());
})();
</script>

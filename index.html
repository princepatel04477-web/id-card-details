<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Polyfill/setter for window.fetch to prevent extension crashes when intercepting fetch
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (_) {}

        // Isolate uncaught errors from external browser extensions
        window.addEventListener('error', function(event) {
          var file = event && event.filename ? event.filename : '';
          if (file.indexOf('chrome-extension://') !== -1 || file.indexOf('moz-extension://') !== -1) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <title>I-Card Extractor</title>
    <meta name="description" content="AI-powered extraction of student & parent details and photos from scanned I-Card performa forms, with review screen and editable DOCX/CSV export." />
    <meta property="og:title" content="I-Card Extractor" />
    <meta property="og:description" content="AI-powered extraction of student & parent details and photos from scanned I-Card performa forms, with review screen and editable DOCX/CSV export." />
